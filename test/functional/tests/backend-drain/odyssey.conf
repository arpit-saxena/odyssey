#
# backend_drain_timeout_ms: a closed server connection keeps its pool slot
# until the backend has really gone away.
#
# The storage points at the proxy started by check_backend_drain.py, which
# forwards to the real postgres on port 5432 and delays Terminate messages.
#

storage "postgres_server" {
	type "remote"
	host "127.0.0.1"
	port 5439
}

database default {
	user default {
		authentication "none"
		storage "postgres_server"
		pool "session"
		pool_size 1
		pool_rollback no
		pool_ttl 1
		client_fwd_error yes
	}
}

listen {
	host "127.0.0.1"
	port 6432
}

backend_drain_timeout_ms 5000

unix_socket_dir "/tmp"
unix_socket_mode "0644"

log_format "%p %t %l [%i %s] (%c) %m\n"
log_file "/var/log/odyssey.log"
log_debug yes
log_config no
log_session yes
log_query no
log_stats no

daemonize yes
pid_file "/var/run/odyssey.pid"
locks_dir "/tmp/odyssey"
enable_online_restart no
bindwith_reuseport yes

workers 1
resolvers 1
